# Ролики команды (стабилизированы к первому кадру). Опасная зона — только на роликах про зону.
# floor — калибровка пола по 4 бутылкам (квадрат ~2,9 м по нашей оценке; уточнить рулеткой).
defaults:
  fps: 10
  patterns: [fall, run, carry_wrong, phone]
  zones:
    - { name: "Весь зал", tags: [tech_area], polygon: full }
