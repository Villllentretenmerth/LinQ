# docker compose -f docker-compose.yml -f docker-compose.upload.yml up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: journal/Dockerfile.upload
    environment:
      UPLOAD_DIR: /data/uploads
      UPLOAD_JOURNAL_URL: http://127.0.0.1:8000
    volumes:
      - uploads:/data/uploads
      - ../core/models:/srv/core/models:ro
volumes:
  uploads: {}
