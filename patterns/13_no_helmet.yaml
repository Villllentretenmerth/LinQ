id: no_helmet
name: "Нет каски в зоне, где она обязательна"
category: [attribute]
severity: warning
status: second
target: person
conditions:
  - block: bodypart_crop
    part: head
    model: crop_attr_v1
    class: no_helmet
    min_score: 0.8
    min_person_height_px: 150
confirm: { window_sec: 2.0, n_of_m: [3, 4], hold_sec: 0 }
zones: { include: [helmet_required], exclude: [] }
dedup: { per: track, cooldown_sec: 600 }
notify: [master]
schedule: always
evidence: { snapshot: true, clip_sec: [-2, 2] }
