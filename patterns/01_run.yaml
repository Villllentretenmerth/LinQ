id: run
name: "Бег и резкие перемещения в зоне техники"
category: [behavior, zone]            # environment | behavior | zone | interaction | attribute; несколько = составное
severity: warning
status: mvp
target: person
conditions:
  - block: person_sequence
    model: behavior_v1
    class: run
    min_score: 0.7
    fallback_rule: "floor_speed_mps > 2.3 or speed_heights_per_sec > 1.5"   # м/с по полу (если пол откалиброван) или ростов/с в кадре
  - in_zone: { point: feet, zone_tag: tech_area }
confirm: { window_sec: 1.0, n_of_m: [2, 3], hold_sec: 0 }   # бегущий пересекает зал за 2–3 с
zones: { include: [tech_area], exclude: [] }
dedup: { per: track, cooldown_sec: 60 }
notify: [master]
schedule: always
evidence: { snapshot: true, clip_sec: [-5, 3] }
